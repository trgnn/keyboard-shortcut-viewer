name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: for f in site/*.js tools/*.mjs tools/*.js; do node --check "$f" || exit 1; done
      - name: Tests (selection rules, SVG snapshots)
        run: node --test tests/
