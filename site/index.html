<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Keyboard Shortcut Viewer</title>
<meta name="description" content="Pick any Mac shortcut and export it as a clean image — the full MacBook keyboard or compact keycaps, in PNG, JPG, WebP, or SVG. Hyperkey, left/right modifiers, double-tap. Runs in the browser, no sign-up." />
<meta name="theme-color" content="#0a0b0d" />
<meta name="color-scheme" content="dark" />
<link rel="canonical" href="https://ksv.trognon.space/" />
<meta property="og:site_name" content="Keyboard Shortcut Viewer" />
<meta property="og:title" content="Keyboard Shortcut Viewer" />
<meta property="og:description" content="Pick any Mac shortcut and export it as a clean image — full keyboard or keycaps. No install, no sign-up." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://ksv.trognon.space/" />
<meta property="og:image" content="https://ksv.trognon.space/og-preview.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Keyboard Shortcut Viewer: a MacBook keyboard with ⌘K selected, next to the export panel." />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Keyboard Shortcut Viewer" />
<meta name="twitter:description" content="Pick any Mac shortcut and export it as a clean image — full keyboard or keycaps. No install, no sign-up." />
<meta name="twitter:image" content="https://ksv.trognon.space/og-preview.png" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
<link rel="manifest" href="/favicon/site.webmanifest" />
<link rel="preload" href="fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/JetBrainsMono-500.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="app" class="ksv-app opt-d">
  <div class="frame-grid"></div>
  <div class="grid-lit"></div>

  <div class="stage">
    <div class="head">
      <span class="eyebrow">keyboard</span>
      <h1 class="title">Shortcut Viewer</h1>
      <p class="lede">double-click a modifier for a double-tap · <b><i data-icon="shift"></i>R</b> clear keys · <b><i data-icon="shift"></i>L</b> change layout · <b><i data-icon="shift"></i>D</b> export · <b><i data-icon="shift"></i>C</b> copy</p>
    </div>

    <div class="kb-wrap">
      <div class="kb-controls">
        <div class="kbc">
          <span class="kbc-l">hyperkey</span>
          <div class="seg" id="hyperSeg"></div>
        </div>
        <div class="kbc">
          <span class="kbc-l">distinguish L/R</span>
          <div class="seg" id="lrSeg"></div>
        </div>
        <div class="kbc accent-kbc">
          <div class="swatches" id="accentSwatches"></div>
        </div>
      </div>

      <div class="panel"><div id="kbMount"></div></div>

      <div class="kb-foot">
        <button class="reset-btn" id="resetBtn"><i data-icon="reset"></i>clear keys</button>
      </div>
    </div>

    <footer class="d-footer">
      <span class="cf-meta"><span class="cf-ver"></span><span class="cf-text">A clean visual for any shortcut on MacBook, because I needed one for a blog article.</span></span>
      <a class="cf-link" href="https://trognon.space" target="_blank" rel="noopener noreferrer">trognon.space<i data-icon="external"></i></a>
    </footer>
  </div>

  <aside class="rail">
    <div class="inspector">
      <section class="grp">
        <div class="grp-h">layout</div>
        <div class="seg wide" id="layoutSeg"></div>
      </section>

      <section class="grp">
        <div class="grp-h">output</div>
        <div class="seg wide" id="extSeg"></div>
        <div class="seg wide" id="bgSeg"></div>
        <div class="opt-row">
          <span class="kbc-l">unavailable</span>
          <div class="seg" id="dimSeg"></div>
        </div>
        <div class="scale-row">
          <span class="kbc-l">scale</span>
          <input type="range" id="scaleRange" aria-label="export scale" />
          <span class="cap" id="scaleVal">2×</span>
        </div>
      </section>
    </div>

    <div class="rail-prev">
      <div class="fl-row">
        <span class="rlbl" id="previewLbl">// preview png</span>
        <span class="cap" id="sizeCap">—</span>
      </div>
      <div class="prev-card bg-dark" id="preview"></div>
    </div>

    <div class="rail-foot">
      <button class="go" id="exportBtn">export</button>
      <button class="go alt" id="copyBtn">copy</button>
    </div>
  </aside>
</div>

<script src="config.js"></script>
<script src="select.js"></script>
<script src="ksv.js"></script>
<script src="app.js"></script>
</body>
</html>
